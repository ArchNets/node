# ==============================================================================
# ArchNet Node — Arvan Cloud Container Deployment (Standalone)
# ==============================================================================
# USAGE:
#   1. Edit the ConfigMap below with your panel URL, server ID, and secret key
#   2. In your ArchNet panel, configure the node with:
#        - Type: vless (or vmess/trojan)
#        - Transport: ws
#        - Port: 8080
#        - Security: tls, certMode: none (Ingress handles TLS)
#        - WS Path: /archnets (must match Ingress path below)
#   3. Apply:  kubectl apply -f arvan-node-no-singbox.yaml
#   4. Update the Ingress host to your actual Arvan-assigned domain
# ==============================================================================

# --- ConfigMap: Node Configuration ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: archnet-node2-config2
data:
  config.yml: |
    Log:
      Level: info
      Output:
      Access: none

    Api:
      ApiHost: "https://panel.archnets.com"
      ServerID: 26
      SecretKey: "jtf1blry-z7b5-edg3-fwgz-6ltss5uznoat"
      Timeout: 30

---
# --- Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: archnet-node2
  labels:
    app: archnet-node2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: archnet-node2
  template:
    metadata:
      labels:
        app: archnet-node2
    spec:
      # hostAliases removed — let DNS resolve panel.archnets.com naturally
      # If panel is behind CDN, direct IP won't have TLS
      # Uncomment below only if DNS doesn't work from Arvan:
      # hostAliases:
      #   - ip: "37.32.43.245"
      #     hostnames:
      #       - "panel.archnets.com"
      containers:
        # Container 1: Your existing node
        - name: archnet-node2
          # Using Docker Hub mirror (docker.io is restricted from Arvan/Iran)
          image: mirror2.chabokan.net/ebadidev/archnets-node:latest
          ports:
            # VPN inbound port — must match panel node config
            - name: vpn-ws
              containerPort: 8080
              protocol: TCP
            # Country-specific inbound ports (panel protocols)
            - name: vpn-de
              containerPort: 8081
              protocol: TCP
            - name: vpn-us
              containerPort: 8082
              protocol: TCP
            - name: vpn-se
              containerPort: 8083
              protocol: TCP
            - name: vpn-iq
              containerPort: 8084
              protocol: TCP
            - name: vpn-tr
              containerPort: 8085
              protocol: TCP
            - name: vpn-ir
              containerPort: 8086
              protocol: TCP
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
              ephemeral-storage: "256Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "512Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/archnets/
              readOnly: true

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep node || exit 1"
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep node || exit 1"
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: archnet-node2-config2

---
# --- Service ---
apiVersion: v1
kind: Service
metadata:
  name: archnet-node2
  labels:
    app: archnet-node2
spec:
  ports:
    - name: vpn-ws
      port: 8080
      protocol: TCP
      targetPort: 8080
    - name: vpn-de
      port: 8081
      protocol: TCP
      targetPort: 8081
    - name: vpn-us
      port: 8082
      protocol: TCP
      targetPort: 8082
    - name: vpn-se
      port: 8083
      protocol: TCP
      targetPort: 8083
    - name: vpn-iq
      port: 8084
      protocol: TCP
      targetPort: 8084
    - name: vpn-tr
      port: 8085
      protocol: TCP
      targetPort: 8085
    - name: vpn-ir
      port: 8086
      protocol: TCP
      targetPort: 8086
  selector:
    app: archnet-node2
  type: ClusterIP

---
# --- Ingress (NGINX with WebSocket support) ---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: archnet-node2-ingress
  annotations:
    # WebSocket support — critical for ws transport
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$remote_addr"
spec:
  ingressClassName: nginx
  rules:
    # CHANGE THIS to your actual Arvan-assigned domain
    - host: archnetnode2-44567c9f4c-panel.apps.ir-central1.arvancaas.ir
      http:
        paths:
          # WebSocket VPN path — must match panel WS Path setting
          - path: /archnets
            pathType: Prefix
            backend:
              service:
                name: archnet-node2
                port:
                  number: 8080
          # 🇩🇪 Germany
          - path: /de
            pathType: Prefix
            backend:
              service:
                name: archnet-node2
                port:
                  number: 8081
          # 🇺🇸 US
          - path: /us
            pathType: Prefix
            backend:
              service:
                name: archnet-node2
                port:
                  number: 8082
          # 🇸🇪 Sweden
          - path: /se
            pathType: Prefix
            backend:
              service:
                name: archnet-node2
                port:
                  number: 8083
          # 🇮🇶 Iraq
          - path: /iq
            pathType: Prefix
            backend:
              service:
                name: archnet-node2
                port:
                  number: 8084
          # 🇹🇷 Turkey
          - path: /tr
            pathType: Prefix
            backend:
              service:
                name: archnet-node2
                port:
                  number: 8085
          # 🇮🇷 Iran (direct)
          - path: /ir
            pathType: Prefix
            backend:
              service:
                name: archnet-node2
                port:
                  number: 8086

# ==============================================================================
# NOTES
# ==============================================================================
# 1. SUPPORTED TRANSPORTS on Arvan:
#      ws (WebSocket), grpc, httpupgrade, xhttp/splithttp
#    NOT supported: raw tcp, reality, UDP protocols (hysteria2, tuic, wireguard)
#
# 2. TLS is terminated by the Arvan Ingress. Set certMode: none in panel.
#
# 3. If using a PRIVATE ghcr.io image, add imagePullSecrets:
#      spec:
#        imagePullSecrets:
#          - name: ghcr-secret
#    Create it with:
#      kubectl create secret docker-registry ghcr-secret \
#        --docker-server=ghcr.io \
#        --docker-username=YOUR_GITHUB_USER \
#        --docker-password=YOUR_GITHUB_PAT
#
# 4. To use Docker Hub instead, change image to:
#      image: archnets/node:latest
#    (requires Docker Hub workflow — see updated GitHub Actions)
#
# 5. For gRPC transport, change the Ingress annotations:
#      nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
#    And update panel transport to "grpc" with a serviceName.
#
# 6. Disk (PVC) rules on Arvan:
#    - Size can only be INCREASED, never decreased
#    - Disks survive app deletion
#    - DELETING a disk = data gone forever
#    - If PVC creation fails via manifest, create via Arvan panel UI
# ==============================================================================
